<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Prompt Builder</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f0f13;
      color: #e2e2e8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      color: #a78bfa;
      margin-bottom: 32px;
    }

    .card {
      background: #1a1a24;
      border: 1px solid #2e2e40;
      border-radius: 12px;
      padding: 28px 32px;
      width: 100%;
      max-width: 720px;
      margin-bottom: 20px;
    }

    .card-title {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #6b6b80;
      margin-bottom: 14px;
    }

    /* File picker */
    .file-row {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .file-name {
      flex: 1;
      background: #12121a;
      border: 1px solid #2e2e40;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.9rem;
      color: #9090a8;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .btn {
      background: #6d28d9;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }
    .btn:hover { background: #7c3aed; }
    .btn:active { background: #5b21b6; }

    .btn-copy {
      background: #065f46;
    }
    .btn-copy:hover { background: #047857; }
    .btn-copy.copied { background: #1d4ed8; }

    #file-input { display: none; }

    /* Template preview */
    .template-preview {
      font-size: 1rem;
      line-height: 1.8;
      color: #c4c4d4;
    }

    .template-preview .placeholder {
      display: inline-block;
      background: #2d1f5e;
      border: 1px solid #5b21b6;
      border-radius: 6px;
      padding: 2px 8px;
      color: #a78bfa;
      font-weight: 600;
      font-size: 0.85rem;
      vertical-align: middle;
      transition: background 0.15s;
    }

    .template-preview .placeholder.filled {
      background: #1a3a2a;
      border-color: #16a34a;
      color: #4ade80;
    }

    /* Parameters */
    .params-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    .param-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .param-label {
      font-size: 0.78rem;
      font-weight: 600;
      color: #a78bfa;
      letter-spacing: 0.04em;
    }

    .param-input {
      background: #12121a;
      border: 1px solid #2e2e40;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.9rem;
      color: #e2e2e8;
      outline: none;
      transition: border-color 0.15s;
      width: 100%;
    }
    .param-input:focus { border-color: #7c3aed; }
    .param-input::placeholder { color: #44445a; }

    /* Output */
    .output-text {
      font-size: 1rem;
      line-height: 1.7;
      color: #e2e2e8;
      background: #12121a;
      border: 1px solid #2e2e40;
      border-radius: 8px;
      padding: 14px 16px;
      min-height: 60px;
      margin-bottom: 14px;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .output-text .unfilled {
      color: #4a4a60;
      font-style: italic;
    }

    .output-footer {
      display: flex;
      justify-content: flex-end;
    }

    .empty-state {
      text-align: center;
      color: #44445a;
      font-size: 0.9rem;
      padding: 16px 0;
    }

    .empty-state svg {
      display: block;
      margin: 0 auto 10px;
      opacity: 0.3;
    }
  </style>
</head>
<body>

<h1>Image Prompt Builder</h1>

<!-- File picker -->
<div class="card">
  <div class="card-title">Template File</div>
  <div class="file-row">
    <div class="file-name" id="file-name-display">No file selected</div>
    <button class="btn" onclick="document.getElementById('file-input').click()">Choose File</button>
  </div>
  <input type="file" id="file-input" accept=".txt">
</div>

<!-- Template preview -->
<div class="card" id="template-card" style="display:none">
  <div class="card-title">Template</div>
  <div class="template-preview" id="template-preview"></div>
</div>

<!-- Parameters -->
<div class="card" id="params-card" style="display:none">
  <div class="card-title">Parameters</div>
  <div class="params-grid" id="params-grid"></div>
</div>

<!-- Output -->
<div class="card" id="output-card" style="display:none">
  <div class="card-title">Generated Prompt</div>
  <div class="output-text" id="output-text"></div>
  <div class="output-footer">
    <button class="btn btn-copy" id="copy-btn" onclick="copyPrompt()">Copy Prompt</button>
  </div>
</div>

<!-- Empty state before file loaded -->
<div class="empty-state" id="empty-state">
  <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
    <polyline points="14 2 14 8 20 8"/>
    <line x1="16" y1="13" x2="8" y2="13"/>
    <line x1="16" y1="17" x2="8" y2="17"/>
    <polyline points="10 9 9 9 8 9"/>
  </svg>
  Select a .txt template file to get started
</div>

<script>
  let templateText = '';
  let params = [];   // [{key, label, value}]

  document.getElementById('file-input').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    document.getElementById('file-name-display').textContent = file.name;
    const reader = new FileReader();
    reader.onload = function(ev) {
      loadTemplate(ev.target.result);
    };
    reader.readAsText(file);
  });

  function loadTemplate(text) {
    templateText = text.trim();

    // Find all unique [parameterX] tokens in order of appearance
    const regex = /\[([^\]]+)\]/g;
    const seen = new Set();
    const ordered = [];
    let m;
    while ((m = regex.exec(templateText)) !== null) {
      const key = m[1];
      if (!seen.has(key)) {
        seen.add(key);
        ordered.push({ key, label: m[0], value: '' });
      }
    }
    params = ordered;

    renderTemplate();
    renderParams();
    renderOutput();

    document.getElementById('template-card').style.display = '';
    document.getElementById('params-card').style.display = params.length ? '' : 'none';
    document.getElementById('output-card').style.display = '';
    document.getElementById('empty-state').style.display = 'none';
  }

  function renderTemplate() {
    const preview = document.getElementById('template-preview');
    // Build HTML: replace each [key] with a styled span
    let html = escapeHtml(templateText).replace(/\[([^\]]+)\]/g, (match, key) => {
      const p = params.find(p => p.key === key);
      const filled = p && p.value.trim() !== '';
      const display = filled ? escapeHtml(p.value) : escapeHtml(match);
      return `<span class="placeholder${filled ? ' filled' : ''}" data-key="${escapeHtml(key)}">${display}</span>`;
    });
    preview.innerHTML = html;
  }

  function renderParams() {
    const grid = document.getElementById('params-grid');
    grid.innerHTML = '';
    params.forEach(p => {
      const group = document.createElement('div');
      group.className = 'param-group';

      const label = document.createElement('label');
      label.className = 'param-label';
      label.textContent = `[${p.key}]`;

      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'param-input';
      input.placeholder = `Enter value for ${p.key}…`;
      input.value = p.value;
      input.addEventListener('input', function() {
        p.value = this.value;
        renderTemplate();
        renderOutput();
      });

      group.appendChild(label);
      group.appendChild(input);
      grid.appendChild(group);
    });
  }

  function renderOutput() {
    const el = document.getElementById('output-text');
    let result = templateText.replace(/\[([^\]]+)\]/g, (match, key) => {
      const p = params.find(p => p.key === key);
      if (p && p.value.trim() !== '') return p.value;
      return match;  // keep placeholder if empty
    });

    // Mark unfilled placeholders visually
    const html = escapeHtml(result).replace(/\[([^\]]+)\]/g, (match, key) => {
      return `<span class="unfilled">${match}</span>`;
    });
    el.innerHTML = html;
  }

  function copyPrompt() {
    // Build plain-text output
    let result = templateText.replace(/\[([^\]]+)\]/g, (match, key) => {
      const p = params.find(p => p.key === key);
      return (p && p.value.trim() !== '') ? p.value : match;
    });

    const btn = document.getElementById('copy-btn');

    const finish = () => {
      btn.textContent = 'Copied!';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = 'Copy Prompt';
        btn.classList.remove('copied');
      }, 2000);
    };

    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(result).then(finish);
    } else {
      const ta = document.createElement('textarea');
      ta.value = result;
      ta.style.cssText = 'position:fixed;top:-9999px;left:-9999px;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      finish();
    }
  }

  function escapeHtml(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
</script>
</body>
</html>
